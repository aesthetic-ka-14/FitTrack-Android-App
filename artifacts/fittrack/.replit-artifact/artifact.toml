kind = "mobile"
previewPath = "/"
title = "FitTrack"
description = "An Android-first fitness companion that turns activity, workout, sleep, and recovery data into clear daily insights and personalized training guidance."
version = "1.0.0"
id = "artifacts/fittrack"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25772

[services.development]
run = "pnpm --filter @workspace/fittrack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fittrack", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fittrack", "run", "serve" ]

[services.env]
PORT = "25772"
BASE_PATH = "/"
